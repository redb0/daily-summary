version: 2

updates:
  # publish.yaml и test.yaml пинят actions на SHA с хвостом `# vX.Y.Z`.
  # Dependabot поднимает SHA и переписывает комментарий вместе.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python:
        patterns:
          - "*"
